<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed Arc Onramp</title>
    <style>
      label {
        display: block;
        margin-block-end: 0.5em;
      }
      input {
        width: min(36em, 100%);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin-block: 1em;
      }
      #onramp-root {
        width: 100%;
        height: 720px;
        margin-block-end: 1em;
      }
      pre:not(:empty) {
        background-color: ghostwhite;
        padding: 1em;
        max-width: 100%;
        overflow: auto;
        border-radius: 0.5em;
        max-height: calc(100vh - 20em);
        word-break: break-all;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Add funds with Arc Onramp</h1>
    </header>
    <main>
      <label>
        App user ID
        <input id="appUserId" placeholder="user-123" required />
      </label>
      <label>
        Destination address
        <input
          id="destinationAddress"
          placeholder="0x..."
          required
        />
      </label>

      <div class="actions">
        <button id="prepareSession" type="button">Prepare session</button>
        <button id="mountIframe" type="button" disabled>Mount iframe</button>
        <button id="openWindow" type="button" disabled>Open popup</button>
      </div>

      <div id="onramp-root"></div>
      <pre id="output"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
