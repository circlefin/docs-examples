<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Kit Unified Balance</title>
    <style>
      header > div {
        display: flex;
        align-items: center;
        gap: 0.5em;
        margin-block-end: 1em;
      }
      p {
        margin: 0;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin-block-start: 1em;
      }
      pre:not(:empty) {
        background-color: ghostwhite;
        padding: 1em;
        max-width: 100%;
        overflow: auto;
        border-radius: 0.5em;
        max-height: calc(100vh - 16em);
        word-break: break-all;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <button id="connectEvm">Connect EVM wallet</button>
        <p id="evmWalletInfo"></p>
      </div>
      <div>
        <button id="connectSolana">Connect Solana wallet</button>
        <p id="solanaWalletInfo"></p>
      </div>
    </header>
    <main>
      <button id="depositFuji" disabled>Deposit Avalanche Fuji</button>
      <button id="depositSolana" disabled>Deposit Solana Devnet</button>
      <button id="checkBalance" disabled>Check Unified Balance</button>
      <form>
        <label for="recipientAddress">Recipient Address</label>
        <input id="recipientAddress" placeholder="0x..." required />
        <button id="spend" disabled>Spend on Arc Testnet</button>
      </form>
    </main>
    <pre id="output"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
